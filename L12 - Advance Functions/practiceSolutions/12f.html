<!DOCTYPE html>
<html lang="en">
<head>
    <title>12e</title>
</head>
<body>

    <button 
      class="add-to-cart-button" 
      onclick=" addToCart(); 
    ">Add to cart</button>

    <p class="js-result"></p>

    <script>
      const addToCartButton = document.querySelector('.add-to-cart-button');
      const result = document.querySelector('.js-result');

      let isTimeout = false;
      let setTimeoutID;

    function addToCart(){

      if(!isTimeout){
        result.innerHTML = 'Added';
        setTimeoutID =  setTimeout(function(){
            result.innerHTML = ''
        }, 2000);
        isTimeout = true;
      }else{
        clearTimeout(setTimeoutID);
        isTimeout = false;
      }
    };
    </script>
</body>
</html>
