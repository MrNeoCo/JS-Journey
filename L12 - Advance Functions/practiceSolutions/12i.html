<!DOCTYPE html>
<html lang="en">
<head>
    <title>App</title>
</head>
<body>
    <button 
      onclick="messages++
      displayNotification();
    ">Add</button>
    <button 
      onclick="
      if(messages > 0){
        messages--;

        if(messages === 0){
        stopDisplayingNotification();
      }
      }
    ">Remove</button>
    <script>
      let messages = 2;
      let intervalID;
      let isDisplayNotification;
      
      displayNotification();
      
      function displayNotification(){
        
        
        if(isDisplayNotification){
          return;
        }

        isDisplayNotification = true;

        intervalID = setInterval(function(){
          if(document.title === 'App'){
            document.title = `(${messages}) New messages`;
          }else{
            document.title = 'App';
          }
        }, 1000);
      }

      function stopDisplayingNotification(){
        isDisplayNotification = false;
        clearInterval(intervalID);
        document.title = 'App';
      }
    </script>
</body>
</html>
