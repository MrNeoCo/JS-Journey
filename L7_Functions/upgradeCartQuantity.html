<!DOCTYPE html>
<html>
  <head>
    <title>upgradedCartQuantity Feature</title>
  </head>
  <body>
    <p>Cart Quantity</p>
    <p>
      <button onclick=" console.log(`Cart Quantity: ${cartQuantity}`);">
        Show Quantity
      </button>
    
    <button 
      onclick="
        updateCartQuantity('add');
      ">
          Add to cart
    </button>
    </p>

    <button 
      onclick="
        updateCartQuantity('remove');
      ">
          Remove from cart
    </button>
    <button 
      onclick="
        updateCartQuantity('↺');
      ">
          Reset Cart
    </button>

    <p>
        <button 
          onclick="
            updateCartQuantity('2');
          ">
            +2
        </button>

        <button 
          onclick="
             updateCartQuantity('3');
          ">
            +3
        </button>

        <button 
            onclick="
              updateCartQuantity('-2');
            ">
              -2
        </button>
    </p>

  <script>
    let cartQuantity = 0;

        function updateCartQuantity(value){

          if(cartQuantity >= 10){
            alert('cart is full');
            return;
          }

          if(value == 'add'){
            cartQuantity += 1;
          }else if(value == 'remove'){
            cartQuantity--;
          }else if(value == '↺'){
            cartQuantity *= 0;
          }else if(value == '2'){
            cartQuantity += 2;
          }else if(value == '3'){
            cartQuantity += 3;
          }else if(value == '-2'){
            cartQuantity -= 2;
          }
    }
  </script>
</body>
</html>
