<!DOCTYPE html>
<html>
  <head>
    <title>7k upgraded CartQuantity Feature</title>
  </head>
  <body>
    <p>Cart Quantity</p>
    <p>
      <button onclick=" console.log(`Cart Quantity: ${cartQuantity}`);">
        Show Quantity
      </button>
    
    <button 
      onclick="
        updateCartQuantity(1);
      ">
          Add to cart
    </button>
    </p>

    <button 
      onclick="
        if(cartQuantity<0){
          alert('not enough items in the cart');
          return;
        }
          updateCartQuantity(-1);
      ">
          Remove from cart
    </button>
    <button 
      onclick="
        cartQuantity *= 0;
        console.log(`Cart Quantity ${cartQuantity}`);
      ">
          Reset Cart
    </button>

    <p>
        <button 
          onclick="
            updateCartQuantity(2);
          ">
            +2
        </button>

        <button 
          onclick="
             updateCartQuantity(3);
          ">
            +3
        </button>

        <button 
            onclick="
                updateCartQuantity(-2);
            ">
              -2
        </button>
    </p>

  <script>
      let cartQuantity = 0;

        function updateCartQuantity(value){

          if(cartQuantity + value > 10){
            alert('cart is full');
          }else if(cartQuantity + value < 0){
            alert('not enough item');
          }else{
            cartQuantity += value;
            console.log(`Cart Quantity ${cartQuantity}`);
          }
        }
  </script>
</body>
</html>
