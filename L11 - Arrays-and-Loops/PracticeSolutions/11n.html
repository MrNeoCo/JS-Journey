<!DOCTYPE html>
<html>
<head>
  <title>11n</title>
</head>
<body>
  
  <script>
    let result = {};
    function countWords(words){
      for(let i = 0; i< words.length; i++){
        let word = words[i];

        // console.log(result[word]);
        if(!result[word]){
          result[word] = 1;
        }else{
          // result[word] = result[word] + 1;
          result[word]++;
        }
      }
      return result;
    }

    console.log(countWords(['apple', 'apple','grape' ,'apple', 'grape']));
  </script>
</body>
</html>
