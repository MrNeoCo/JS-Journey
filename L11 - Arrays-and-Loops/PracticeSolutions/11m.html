    function minMax(nums){

      let min_max = {
        min: 0,
        max: 0
      };

      if(nums[0] === undefined){
          min_max.min = null; 
          min_max.max = null;
          console.log(min_max);
          return; 
        }else if(nums.length === 1){
          min_max.min = nums[0]; 
          min_max.max = nums[0];
          console.log(min_max);
          return;
        }
      
      for(let i=0; i < nums.length; i++){

          if(nums[i] < min_max.min){
            min_max.min = nums[i];
          }else if(nums[i] > min_max.max){
            min_max.max = nums[i];
          }

      }
      console.log(min_max);
    }

    minMax([1,-3,5]);
    minMax([]);
    minMax([3]);
    minMax([-2]);
  </script>
