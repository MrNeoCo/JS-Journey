<body>
  
  <script>
    function arraySwap(arr){
      const first = arr[0];
      const last = arr[arr.length-1];

      arr[0] = last;
      arr[arr.length-1] = first;
      console.log(arr)
    }

    arraySwap([1, 20, 22, 24, 5]);
    arraySwap(['hi', 'hello', 'good']);
  </script>
