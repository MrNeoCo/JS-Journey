<!DOCTYPE html>
<html>
<head>
  <title>11l</title>
</head>
<body>
  
  <script>
    function minMax(nums){

      let min_max = {
        min: 0,
        max: 0
      };

      for(let i=0; i < nums.length; i++){
        if(nums[i] < min_max.min){
          min_max.min = nums[i];
        }else if(nums[i] > min_max.max){
          min_max.max = nums[i];
        }
      }
      console.log(min_max);
    }

    minMax([1,-3,5]);
    minMax([-2, 3, -5, 7, 10]);
  </script>
</body>
</html>
