<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10e</title>
    <style>
      .toggle-button{
        border: none;
        background-color: rgb(240,240,240);
        color: black;
        padding: 10px 15px;
        border-radius: 5px;
        margin-left: 5px;
        cursor: pointer;
      }
      .is-toggled{
        background-color: black;
        color: white;
      }
    </style>
</head>
<body>

  <button
    onclick="
      const button = document.querySelector('.js-button-1');
        if(!button.classList.contains('is-toggled')){
          button.classList.add('is-toggled');
        }else{
          button.classList.remove('is-toggled');
        }
    " class="js-button-1 toggle-button" >Gaming</button>
    
  <button
    onclick="
        const button = document.querySelector('.js-button-2');
          if(!button.classList.contains('is-toggled')){
            button.classList.add('is-toggled');
          }else{
            button.classList.remove('is-toggled');
          }
    " class="js-button-2 toggle-button" >Music</button>

  <button
    onclick="
    const button = document.querySelector('.js-button-3');
        if(!button.classList.contains('is-toggled')){
          button.classList.add('is-toggled');
        }else{
          button.classList.remove('is-toggled');
        }
    " class="js-button-3 toggle-button" >Tech</button>
</body>
</html>
