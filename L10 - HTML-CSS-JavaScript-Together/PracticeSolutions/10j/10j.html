<!DOCTYPE html>
<html>
  <head>
    <title>10j - DOM with calculator</title>
  </head>
  <link rel="stylesheet" href="10j.css">
  <body>

    <p class="js-calculation-element result-space"></p>
    
  <p>
      <button 
        onclick="
          updateCalculation('1');
        " class="js-input-button js-button">
            1
      </button>
      <button 
        onclick="
          updateCalculation('2');
        " class="js-input-button js-button">
            2
      </button>
      <button 
        onclick="
          updateCalculation('3');
        " class="js-input-button js-button">
            3
      </button>
      <button 
        onclick="
          updateCalculation(' + ');
        " class="js-operation-button js-button">
            +
      </button>
  </p>
  <p>
      <button 
        onclick="
          updateCalculation('4');
        " class="js-input-button js-button">
            4
      </button>
      <button 
        onclick="
          updateCalculation('5');
        " class="js-input-button js-button">
            5
      </button>
      <button 
        onclick="
          updateCalculation('6');
        " class="js-input-button js-button">
            6
      </button>
      <button 
        onclick="
          updateCalculation(' - ');
        " class="js-operation-button js-button">
            -
      </button>
  </p>
  <p>
      <button 
        onclick="
          updateCalculation('7');
        " class="js-input-button js-button">
            7
      </button>
      <button 
        onclick="
          updateCalculation('8');
        " class="js-input-button js-button">
            8
      </button>
      <button 
        onclick="
          updateCalculation('9');
        " class="js-input-button js-button">
            9 
      </button>
      <button 
        onclick="
          updateCalculation(' * ');
        " class="js-operation-button js-button">
            * 
      </button>
  </p>

  <p>
    <button 
      onclick="
      calculation = calculation * 0;
      " class="js-input-button js-button">.</button>

    <button
      onclick="
        updateCalculation('0');
      " class="js-input-button js-button">
          0
    </button>
    <button 
      onclick="
        calculation = eval(calculation);
      if(calculation === undefined){
        console.log(0);
        location.reload();
      }else{
        localStorage.setItem('calculation', JSON.stringify(calculation));
        console.log(calculation);
        displayCalculation();
      }
      " class="js-input-button js-button">
          =
    </button>
    <button 
      onclick="
        updateCalculation(' / ');
      " class="js-operation-button js-button">
          /
    </button>
  </p>

    <button 
    onclick=" 
      calculation = '';
      localStorage.removeItem('calculation');
      console.log(calculation);
      displayCalculation();
    " class="js-input-button js-button clear-button">
      Clear
    </button>

    <script src="10j.js"></script>
  </body>
</html>
