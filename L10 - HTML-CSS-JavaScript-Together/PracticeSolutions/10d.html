<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10d</title>
  <style>
    .toggle-button{
      background-color: rgb(240, 240, 240);
      color: black;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-family: arial;
      padding: 10px 15px;
      cursor: pointer;
    }
    .is-toggled{
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <button 
    class="toggle-button js-button" 
    onclick=" 
    const button = document.querySelector('.toggle-button');
    if(!button.classList.contains('is-toggled')){
      button.classList.add('is-toggled');
    }else{
      button.classList.remove('is-toggled');
    }
    ">Gaming</button>
  <script>
  
  </script>
</body>
</html>
