<!DOCTYPE html>
<html>
<head>
  <title>10h - Amazon Shipping Calculator</title>
</head>
<style>
  body{
    font-family: Arial;
  }
  .cost-input{
    font-size: 15px;
    padding:10px;
  }
  .calculate-button{
    font-size: 15px;
    background-color: rgb(2, 182, 2);
    border: none;
    padding: 12px 10px;
    color: white;
  }
  .js-error-message{
    font-size: 15px;
    color: red;
  }
</style>
<body>
  <p>Amazon Shipping Calculator</p>
  <input placeholder="Cost of order" class="js-cost-input cost-input" 
    onkeydown="
    handelCostKeydown(event);
  ">

  <button onclick="
    calculateTotal();
  " class="calculate-button">Calculate</button>

  <p class="js-total-cost "></p>
  <p class="js-error-message "></p>

  <script>

    function handelCostKeydown(event){
      if(event.key === 'Enter'){
        calculateTotal();
      }
    }

    function calculateTotal(){
      const inputElement = document.querySelector('.js-cost-input');
      const resultElement = document.querySelector('.js-total-cost');
      const errorElement = document.querySelector('.js-error-message');

      resultElement.innerHTML='';
      errorElement.innerHTML='';
      
      let cost = Number(inputElement.value);
      console.log(cost);
      
      if(cost<0){
        document.querySelector('.js-error-message')
          .innerHTML = `Error: cost cannot be less than $0`;
          return;
      }
      
      if(cost < 40){
        cost += 10;
      }
      document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
    }
  </script>
</body>
</html>
