<!DOCTYPE html>
<html>
<head>
  <title>Amazon Shipping Calculator</title>
</head>
<style>
  body{
    font-family: Arial;
  }
  .cost-input{
    font-size: 15px;
    padding:10px;
  }
  .calculate-button{
    font-size: 15px;
    background-color: rgb(2, 182, 2);
    border: none;
    padding: 12px 10px;
    color: white;
  }
</style>
<body>
  <p>Amazon Shipping Calculator</p>
  <input placeholder="Cost of order" class="js-cost-input cost-input" 
    onkeydown="
    handelCostKeydown(event);
  ">

  <button onclick="
    calculateTotal();
  " class="calculate-button">Calculate</button>

  <p class="js-total-cost "></p>

  <script>

    function handelCostKeydown(event){
       console.log('Typng...');
      console.log(event.key);
      if(event.key === 'Enter'){
        calculateTotal();
      }
    }
    function calculateTotal(){
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);
      console.log(cost);
      if(cost < 40){
        cost += 10;
      }
      document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
    }
  </script>
</body>
</html>
