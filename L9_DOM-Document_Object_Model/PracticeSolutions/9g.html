<!DOCTYPE html>
<html>
<head>
  <title>7.99 fix - Amazon Shipping Calculator</title>
</head>
<body>
  <p>Amazon Shipping Calculator</p>
  <input placeholder="Cost of order" class="js-cost-input" 
    onkeydown="
    handelCostKeydown(event);
  ">

  <button onclick="
    calculateTotal();
  ">Calculate</button>

  <p class="js-total-cost "></p>

  <script>

    function handelCostKeydown(event){
      //  console.log('Typng...');
      // console.log(event.key);
      if(event.key === 'Enter'){
        calculateTotal();
      }
    }
    function calculateTotal(){
      const inputElement = document.querySelector('.js-cost-input');
      console.log(inputElement.value);
      let cost = Number(inputElement.value) * 100;
      if(cost < 4000){
        cost += 1000;
      }
      document.querySelector('.js-total-cost').innerHTML = `$${cost/100}`;
    }
  </script>
</body>
</html>
