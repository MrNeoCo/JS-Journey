<!DOCTYPE html>

<html>
  <head>
    <title>Rock Paper Scissor Styled</title>
    <link rel="stylesheet" href="L12-rock-paper-scissors-async.css">
    <body>
      <p class="title">Rock  Paper Scissor</p>

<!-- ------------implementation of addEventListeners---------------------      -->
      <button class="move-button js-rock-button">
        <img src="images/rock-emoji.png" class="move-icon" alt="rock">
        </button>
<!-- -------------implementing arrow functions here in the setInterval--------- -->
      <button class="move-button js-paper-button">
        <img src="images/paper-emoji.png"  class="move-icon" alt="paper">
      </button>
<!-- -------------implementing arrow functions here in the setInterval--------- -->
      <button class="move-button js-scissor-button">
          <img src="images/scissor-emoji.png" class="move-icon" alt="scissor">
      </button>

      <p class="js-result result"></p>
      <p class="js-moves"></p>
      <p class="js-score score"></p>
      
      <button class="reset-score-button js-reset-score-button">Reset Score</button>

      <button class="auto-play-button js-auto-play-button">AutoPlay</button>

      <script src="L12-rock-paper-scissors-async.js"></script>
    </body>
  </head>
</html>
