<!DOCTYPE html>

<html>
  <head>
    <title>Rock Paper Scissor Styled</title>
    <link rel="stylesheet" href="L12t-rock-paper-scissors-async.css">
    <body>
      <p class="title">Rock  Paper Scissor</p>

      <button
        onclick="
          playGame('rock');
        " class="move-button">
        <img src="images/rock-emoji.png" class="move-icon" alt="rock">
        </button>

      <button 
        onclick="
          playGame('paper');
        " class="move-button">
        <img src="images/paper-emoji.png"  class="move-icon" alt="paper">
      </button>

      <button
      onclick="
        playGame('scissor');
        " class="move-button">
          <img src="images/scissor-emoji.png" class="move-icon" alt="scissor">
      </button>

      <p class="js-result result"></p>
      <p class="js-moves"></p>
      <p class="js-score score"></p>
      
      <button onclick="
            score.wins = 0;
            score.ties = 0;
            score.loses = 0;
            localStorage.removeItem('score');
            updateScoreElement();
            " class="reset-score-button">Reset Score</button>

      <button class="auto-play-button">Auto Play</button>

      <script src="L12t-rock-paper-scissors-async.js"></script>
    </body>
  </head>
</html>
