<!DOCTYPE html>
<html lang="en">
<head>
    <title>App</title>
</head>
<body>
    <button class="js-add-button">Add</button>
    <button class="js-remove-button">Remove</button>
    <script>
      let messages = 2;
      let intervalID;
      let isDisplayNotification;

      const addButton = document.querySelector('.js-add-button');
      const removeButton = document.querySelector('.js-remove-button');
      
      addButton.addEventListener('click', ()=>{
        messages++;
        displayNotification();
      });

      removeButton.addEventListener('click', ()=>{
        if(messages > 0){
          messages--;
        if(messages === 0){
          stopDisplayingNotification();
        }
        }
      });

      displayNotification();
      
      function displayNotification(){
        
        
        if(isDisplayNotification){
          return;
        }

        isDisplayNotification = true;

        intervalID = setInterval(()=>{
          if(document.title === 'App'){
            document.title = `(${messages}) New messages`;
          }else{
            document.title = 'App';
          }
        }, 1000);
      }

      function stopDisplayingNotification(){
        isDisplayNotification = false;
        clearInterval(intervalID);
        document.title = 'App';
      }
    </script>
</body>
</html>
