<!DOCTYPE html>
<html lang="en">
<head>
    <title>12d</title>
</head>
<body>
    <button class="start-finished-button">Start</button>
    <script>
        const startButton = document.querySelector('.start-finished-button');
        startButton.addEventListener('click', ()=>{
            loadingButton();
        });
        function loadingButton(){
            startButton.innerHTML = 'Loading...'
            setTimeout(()=>{
                startButton.innerHTML = 'Finished!'
            }, 1000);
        };
    </script>
</body>
</html>
