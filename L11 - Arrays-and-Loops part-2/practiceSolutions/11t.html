  <script>
    // let arr = ['egg','apple','egg','egg','ham'];
    // console.log(arr.reverse());
    // console.log(arr.reverse());
    function removeEgg(string){
      const result = [];
      let count = 1;
      string.reverse();

      for(let i=0; i<string.length; i++){
        if(string[i] === 'egg' && count < 3){
          count++;
          continue;
        }else{
          result.push(string[i]);
        }
      }
      result.reverse();
      return result;
    }
    console.log(removeEgg(['egg','apple','egg','egg','ham',]));
  </script>
