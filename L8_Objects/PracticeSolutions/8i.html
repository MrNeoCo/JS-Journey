<!DOCTYPE html>
<html>
<head>
  <title>Coin Flip</title>
</head>
<body>

  <button onclick="
    playGame('heads');
  ">
    heads
  </button>

  <button onclick="
    playGame('tails');
  ">
    tails
  </button>

  <script>

      function playGame(guess){
        let computerPlay = Math.random();
        let result = (computerPlay <  0.5)? 'heads': 'tails';
        console.log((guess === result)? 'You Win!':'You Lose!');
        // return (guess === result)? alert('You Win!'):alert('You Lose!');
      }

  </script>
</body>
</html>
