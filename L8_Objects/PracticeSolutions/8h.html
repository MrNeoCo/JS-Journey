<!DOCTYPE html>
<html>
  <head>
    <title>upgrade calculator</title>
  </head>
  <body>
    
  <p>
      <button 
        onclick="
          updateCalculation('1');
        ">
            1
      </button>
      <button 
        onclick="
          updateCalculation('2');
        ">
            2
      </button>
      <button 
        onclick="
          updateCalculation('3');
        ">
            3
      </button>
      <button 
        onclick="
          updateCalculation('+');
        ">
            +
      </button>
  </p>
  <p>
      <button 
        onclick="
          updateCalculation('4');
        ">
            4
      </button>
      <button 
        onclick="
          updateCalculation('5');
        ">
            5
      </button>
      <button 
        onclick="
          updateCalculation('6');
        ">
            6
      </button>
      <button 
        onclick="
          updateCalculation('-');
        ">
            -
      </button>
  </p>
  <p>
      <button 
        onclick="
          updateCalculation('7');
        ">
            7
      </button>
      <button 
        onclick="
          updateCalculation('8');
        ">
            8
      </button>
      <button 
        onclick="
          updateCalculation('9');
        ">
            9 
      </button>
      <button 
        onclick="
          updateCalculation('*');
        ">
            * 
      </button>
  </p>

  <p>
    <button 
      onclick="
      calculation = calculation * 0;
      ">.</button>

    <button
      onclick="
        updateCalculation('0');
      ">
          0
    </button>
    <button 
      onclick="
        calculation = eval(calculation);
      if(calculation === undefined){
        console.log(0);
        location.reload();
      }else{
        localStorage.setItem('calculation', JSON.stringify(calculation));
        console.log(calculation);
      }
      ">
          =
    </button>
    <button 
      onclick="
        updateCalculation('/');
      ">
          /
    </button>
  </p>

    <button 
    onclick=" 
      calculation = '';
      localStorage.removeItem('calculation');
      console.log(calculation);
    ">
      clear
    </button>


    <script>
        let calculation = localStorage.getItem('calculation') || '';
        function updateCalculation(value){
          calculation += value;
          console.log(calculation);
        }
    </script>
  </body>
</html>
