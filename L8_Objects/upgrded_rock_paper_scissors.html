<!DOCTYPE html>

<html>
  <head>
    <title>Rock Paper Scissor</title>
    <body>
      <p>With Score: Rock  Paper Scissor</p>

      <button
        onclick="
          playGame('rock');
        ">Rock</button>

      <button 
        onclick="
          playGame('paper');
        ">Paper</button>

      <button
      onclick="
        playGame('scissor');
        ">Scissor</button>
      
      <button onclick="
            score.wins = 0;
            score.ties = 0;
            score.loses = 0;
            localStorage.removeItem('score');
        ">Reset Score</button>

        <p><a href="#">Click here</a>to see the final version of the project</p>
      <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
          wins: 0,
          losses: 0,
          ties: 0
        };

        function playGame(playerMove){
          const computerMove = pickComputerMove();
          let result = '';
            
          if(playerMove === 'rock'){
              if(computerMove === 'rock')
                {
                  result = 'tie';
                } else if(computerMove === 'scissor')
                {
                  result = 'You Win';
                }else if(computerMove === 'paper')
                {
                  result = 'You Lose';
                }
          }else if(playerMove === 'paper'){

                if(computerMove === 'rock')
                  {
                    result = 'You Win';
                  }else if(computerMove === 'scissor')
                  {
                    result = 'You Lose';
                  }else if(computerMove === 'paper')
                  {
                    result = 'tie';
                  }
          }else if(playerMove === 'scissor'){

                if(computerMove === 'rock')
                  {
                    result = 'You Lose';
                  }else if(computerMove === 'scissor')
                  {
                    result = 'tie';
                  }else if(computerMove === 'paper')
                  {
                    result = 'You Win';
                  }
          }

          if(result === 'You Win'){
            score.wins += 1;
          }else if(result === 'tie'){
            score.ties +=1;
          }else if(result === 'You Lose'){
            score.loses += 1;
          }

          localStorage.setItem('score', JSON.stringify(score));

            alert(`You Picked ${playerMove}, Computer Picked ${computerMove}, result ${result}
wins: ${score.wins}, ties: ${score.ties}, loses: ${score.loses}`);
        }

        function pickComputerMove(){
          let computerMove = '';
          let randomNumber = Math.random();
            
            if(randomNumber >= 0 && randomNumber < 1/2)
              {
                computerMove = 'rock';
              }else if(randomNumber >= 1/3 && randomNumber < 2/3)
              {
                computerMove = 'paper';
              }else if(randomNumber >= 2/3 && randomNumber < 1)
              {
                computerMove = 'scissor';
              }

          return computerMove;
        }
      </script>
    </body>
  </head>
</html>
